name: CI

on:
  # Restricted to the default branch on purpose: a commit on a branch with an
  # open PR would otherwise trigger this workflow twice (once for `push`, once
  # for `pull_request`) and run the identical job for double the CI minutes.
  # Feature branches are covered by the pull_request trigger below.
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so rapid pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Check module size limit
        run: npm run lint:size

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Boots the built production bundle and asserts it actually serves:
      # catches regressions that compile cleanly but fail at runtime.
      - name: Smoke test production bundle
        run: npm run smoke
